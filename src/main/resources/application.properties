# 1. Configuração do Banco de Dados H2 (Em Memória)
spring.datasource.url=jdbc:postgresql://localhost:5432/telemonitoramento_db

spring.datasource.username=postgres
spring.datasource.password=TCC@)@

# 2. Faz o Hibernate criar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# 3. Mostra os comandos SQL formatados no console do IntelliJ
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect